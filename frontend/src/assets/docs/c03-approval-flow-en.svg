<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" role="img" aria-labelledby="title desc">
<title id="title">Reservation approval — current structure</title>
<desc id="desc">Within the application, authentication passes the request to the reservation API, then to reservation processing and notifications. Authentication, processing and notifications use data storage, which reads and writes PostgreSQL outside the application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527486"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173348}.title{font-size:22px;font-weight:700}.role{font-size:18px;fill:#456174}.label{font-size:17px;fill:#38566b}.badge{font-size:14px;fill:#487369;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#527486;stroke-width:2.5;marker-end:url(#arrow)}.node{fill:white;stroke:#afc5d1;stroke-width:1.5}</style>
<rect width="1040" height="940" fill="#fff"/>
<rect x="20" y="20" width="1000" height="750" rx="20" fill="#f5f9fc" stroke="#c4d4df" stroke-width="2"/>
<text x="48" y="58" class="badge">APPLICATION CODE · BACKEND MODULES</text>
<!-- Main request path -->
<path class="edge" d="M210 190 V250"/><text x="232" y="225" class="label">passes request</text>
<path class="edge" d="M210 360 V420"/><text x="232" y="395" class="label">requests approval</text>
<path class="edge" d="M210 530 V590"/><text x="232" y="565" class="label">creates notification</text>
<!-- Dependencies converge on storage -->
<path class="edge" d="M370 135 H620 V450 H680"/><text x="402" y="120" class="label">loads session</text>
<path class="edge" d="M370 475 H680"/><text x="400" y="460" class="label">loads / saves data</text>
<path class="edge" d="M370 645 H620 V500 H680"/><text x="402" y="630" class="label">saves notification</text>
<path class="edge" d="M835 530 V825"/><rect x="748" y="698" width="174" height="34" rx="8" fill="#f5f9fc"/><text x="835" y="721" class="label" text-anchor="middle">read / write</text>
<!-- Application modules -->
<rect class="node" x="50" y="80" width="320" height="110" rx="14"/><text class="title" x="74" y="122">Authentication</text><text class="role" x="74" y="154">Verifies the signed-in user.</text>
<rect class="node" x="50" y="250" width="320" height="110" rx="14"/><text class="title" x="74" y="292">Reservation API</text><text class="role" x="74" y="324">Receives an approval request.</text>
<rect class="node" x="50" y="420" width="320" height="110" rx="14"/><text class="title" x="74" y="462">Reservation processing</text><text class="role" x="74" y="494">Checks conditions and confirms.</text>
<rect class="node" x="50" y="590" width="320" height="110" rx="14"/><text class="title" x="74" y="632">Notifications</text><text class="role" x="74" y="664">Creates a student notification.</text>
<rect class="node" x="680" y="420" width="310" height="110" rx="14"/><text class="title" x="704" y="462">Data storage</text><text class="role" x="704" y="494">Loads and saves records.</text>
<!-- Database lies outside application boundary -->
<rect x="680" y="825" width="310" height="95" rx="14" fill="#eaf0fa" stroke="#90a8ca" stroke-width="2"/><text class="title" x="835" y="865" text-anchor="middle">PostgreSQL</text><text class="role" style="font-size:16px" x="835" y="894" text-anchor="middle">Database outside application code</text>
</svg>