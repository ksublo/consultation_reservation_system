<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1510" viewBox="0 0 1700 1510" role="img" aria-labelledby="title desc">
<title id="title">Create Reservation — sequence</title>
<desc id="desc">Authenticated request, validation, reservation insertion, conflict or transactional history and notification.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="1700" height="1510" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:17px}.heading{font-size:30px;font-weight:700}.small{font-size:16px}.bold{font-weight:700}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6}.message{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="50" y="55" text-anchor="start" class="heading">Create Reservation</text>
<text x="50" y="90" text-anchor="start" class="small">Supplementary scenario • current implementation • one backend application</text>
<rect x="25" y="125" width="250" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="150" y="153" text-anchor="middle" class="bold">Student / React UI</text>
<line x1="150" y1="215" x2="150" y2="1405" class="life"/>
<rect x="305" y="125" width="250" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="430" y="153" text-anchor="middle" class="">Authentication</text>
<text x="430" y="177" text-anchor="middle" class="">BearerTokenFilter</text>
<text x="430" y="201" text-anchor="middle" class="">AuthService</text>
<line x1="430" y1="215" x2="430" y2="1405" class="life"/>
<rect x="585" y="125" width="250" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="710" y="153" text-anchor="middle" class="">Reservation API</text>
<text x="710" y="177" text-anchor="middle" class="">ReservationController</text>
<line x1="710" y1="215" x2="710" y2="1405" class="life"/>
<rect x="865" y="125" width="250" height="90" rx="8" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="990" y="153" text-anchor="middle" class="">Reservation management</text>
<text x="990" y="177" text-anchor="middle" class="">ReservationService</text>
<line x1="990" y1="215" x2="990" y2="1405" class="life"/>
<rect x="1145" y="125" width="250" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="1270" y="153" text-anchor="middle" class="">Persistence</text>
<text x="1270" y="177" text-anchor="middle" class="">Repository + PostgreSQL</text>
<line x1="1270" y1="215" x2="1270" y2="1405" class="life"/>
<rect x="1425" y="125" width="250" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="1550" y="153" text-anchor="middle" class="">Internal notifications</text>
<text x="1550" y="177" text-anchor="middle" class="">NotificationService</text>
<line x1="1550" y1="215" x2="1550" y2="1405" class="life"/>
<text x="290.0" y="239" text-anchor="middle" class="small">POST /api/reservations</text>
<text x="290.0" y="263" text-anchor="middle" class="small">+ bearer token</text>
<line x1="150" y1="280" x2="430" y2="280" class="message"/>
<text x="850.0" y="323" text-anchor="middle" class="small">Load authentication session</text>
<line x1="430" y1="340" x2="1270" y2="340" class="message"/>
<text x="850.0" y="378" text-anchor="middle" class="small">Verified identity and active role</text>
<line x1="1270" y1="395" x2="430" y2="395" class="message" stroke-dasharray="7 5"/>
<text x="570.0" y="433" text-anchor="middle" class="small">Forward request</text>
<line x1="430" y1="450" x2="710" y2="450" class="message"/>
<text x="850.0" y="493" text-anchor="middle" class="small">create(request)</text>
<line x1="710" y1="510" x2="990" y2="510" class="message"/>
<text x="1130.0" y="558" text-anchor="middle" class="small">Load student and slot</text>
<line x1="990" y1="575" x2="1270" y2="575" class="message"/>
<text x="1130.0" y="608" text-anchor="middle" class="small">Student, slot, reservations</text>
<line x1="1270" y1="625" x2="990" y2="625" class="message" stroke-dasharray="7 5"/>
<rect x="760" y="645" width="670" height="80" rx="8" fill="#fffbeb" stroke="#e5c46a"/>
<text x="1095" y="668" text-anchor="middle" class="small">Check student role, availability and the 3-hour cutoff.</text>
<text x="1095" y="692" text-anchor="middle" class="small">At most 5 PENDING; no overlapping active reservations.</text>
<text x="1095" y="716" text-anchor="middle" class="small">Current create takes studentId from the request.</text>
<text x="1130.0" y="739" text-anchor="middle" class="small">saveAndFlush()</text>
<text x="1130.0" y="763" text-anchor="middle" class="small">new PENDING reservation</text>
<line x1="990" y1="780" x2="1270" y2="780" class="message"/>
<rect x="45" y="810" width="1610" height="600" rx="0" fill="none" stroke="#64748b"/>
<rect x="45" y="810" width="70" height="30" rx="0" fill="#e2e8f0" stroke="#64748b"/>
<text x="80" y="832" text-anchor="middle" class="bold">alt</text>
<text x="135" y="837" text-anchor="start" class="bold">Conflict: another reservation has taken the slot</text>
<text x="1130.0" y="868" text-anchor="middle" class="small">Unique index violation</text>
<line x1="1270" y1="885" x2="990" y2="885" class="message" stroke-dasharray="7 5"/>
<text x="850.0" y="913" text-anchor="middle" class="small">ApiException: HTTP 409</text>
<line x1="990" y1="930" x2="710" y2="930" class="message" stroke-dasharray="7 5"/>
<text x="430.0" y="958" text-anchor="middle" class="small">HTTP 409 — reservation not created</text>
<line x1="710" y1="975" x2="150" y2="975" class="message" stroke-dasharray="7 5"/>
<line x1="45" y1="1000" x2="1655" y2="1000" stroke="#64748b" stroke-dasharray="8 5"/>
<text x="65" y="1028" text-anchor="start" class="bold">else — reservation inserted successfully</text>
<text x="1130.0" y="1063" text-anchor="middle" class="small">Save CREATED history</text>
<line x1="990" y1="1080" x2="1270" y2="1080" class="message"/>
<text x="1270.0" y="1123" text-anchor="middle" class="small">Create notification for teacher</text>
<line x1="990" y1="1140" x2="1550" y2="1140" class="message"/>
<text x="1410.0" y="1183" text-anchor="middle" class="small">Save notification</text>
<line x1="1550" y1="1200" x2="1270" y2="1200" class="message"/>
<rect x="865" y="1220" width="550" height="64" rx="8" fill="#ecfdf5" stroke="#6bbda5"/>
<text x="1140" y="1245" text-anchor="middle" class="small">Spring commits reservation, history and notification together.</text>
<text x="1140" y="1269" text-anchor="middle" class="small">Write failure → rollback of the entire transaction.</text>
<text x="850.0" y="1289" text-anchor="middle" class="small">ReservationResponse</text>
<text x="850.0" y="1313" text-anchor="middle" class="small">after successful commit</text>
<line x1="990" y1="1330" x2="710" y2="1330" class="message" stroke-dasharray="7 5"/>
<text x="430.0" y="1363" text-anchor="middle" class="small">HTTP 201 — ID and PENDING status</text>
<line x1="710" y1="1380" x2="150" y2="1380" class="message" stroke-dasharray="7 5"/>
<text x="50" y="1450" text-anchor="start" class="small">Simplification: invalid sessions and failed business checks stop before persistence.</text>
<text x="50" y="1478" text-anchor="start" class="small">The database index enforces one active reservation per slot; all services run in one backend.</text>
</svg>
